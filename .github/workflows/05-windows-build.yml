name: Windows VS2026 cold-cache benchmark

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows build and test matrix
  build-and-test-windows:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025-vs2026
            vs_version: '18.0'
            msvc_arch: x64
            python_version: '3.10'

    env:
      SCCACHE_GHA_ENABLED: "true"
      # A fresh namespace makes compiler-cache reads cold without deleting caches.
      SCCACHE_GHA_VERSION: vs2026-cold-20261110-1bd5d1d6-01
      SCCACHE_IDLE_TIMEOUT: "0"
      CMAKE_GENERATOR: Ninja
      NINJA_STATUS: '[%f/%t %r running %es] '

    steps:
      - name: Show env info
        run: |
          Get-CimInstance -ClassName Win32_Processor
          Get-Volume | Select-Object DriveLetter, FileSystemType, SizeRemaining, Size
          try {
            Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled
          } catch {
            Write-Host "Defender status unavailable: $_"
          }
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -prerelease -format json
        shell: powershell

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cleanup left marker files
        run: |
          git submodule foreach --recursive 'git reset --hard && git clean -ffdx'
        shell: powershell

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          # The explicit statistics steps below are best-effort. Do not let
          # the action's post-run statistics fail an otherwise successful job.
          disable_annotations: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.msvc_arch }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            .github/constraints-build.txt

      - name: Set up MSVC environment
        # v1.13.0 cannot resolve VS 2026's version range and directory layout.
        # Use the runner's latest installation, then verify its version below.
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Verify MSVC toolchain
        shell: powershell
        env:
          EXPECTED_VS_VERSION: ${{ matrix.vs_version }}
        run: |
          if ($env:VisualStudioVersion -ne $env:EXPECTED_VS_VERSION) {
            throw "Expected VS $env:EXPECTED_VS_VERSION, got $env:VisualStudioVersion"
          }
          $toolsetPrefix = if ($env:EXPECTED_VS_VERSION -eq '18.0') { '14.5' } else { '14.4' }
          if (-not $env:VCToolsVersion.StartsWith($toolsetPrefix)) {
            throw "Unexpected MSVC toolset: $env:VCToolsVersion (expected $toolsetPrefix*)"
          }
          where.exe cl
          cl /Bv
          # cl without an input reports an error; /Bv above is diagnostic only.
          $global:LASTEXITCODE = 0

      - name: Set up environment variables
        run: python .github/scripts/setup_build_env.py
        shell: powershell

      - name: Install dependencies
        run: |
          python -m pip install --constraint .github/constraints-build.txt --upgrade pip `
            pybind11 `
            cmake `
            ninja `
            pytest `
            pytest-xdist `
            scikit-build-core `
            setuptools_scm
        shell: powershell

      - name: Build from source
        run: |
          cd "$env:GITHUB_WORKSPACE"
          python -m pip install -v . `
            --no-build-isolation `
            --config-settings='cmake.define.BUILD_TOOLS=ON' `
            --config-settings='cmake.define.ENABLE_WERROR=ON' `
            --config-settings='cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache' `
            --config-settings='cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache'
        shell: powershell

      - name: Show sccache statistics after pip install
        if: always()
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force benchmark-artifacts | Out-Null
          sccache --show-stats
          sccache --show-stats --stats-format json | Out-File benchmark-artifacts/sccache-source.json -Encoding utf8
        shell: powershell

      - name: Check main and external build generators
        if: always()
        shell: powershell
        run: |
          $caches = @(
            'build/CMakeCache.txt',
            'build/thirdparty/arrow/arrow/src/ARROW.BUILD-build/CMakeCache.txt',
            'build/thirdparty/lz4/lz4/src/Lz4.BUILD-build/CMakeCache.txt'
          )
          foreach ($cache in $caches) {
            if (Test-Path $cache) {
              Write-Host "Build backend: $cache"
              Select-String -Path $cache -Pattern '^CMAKE_GENERATOR:INTERNAL=', '^CMAKE_MAKE_PROGRAM:', '^CMAKE_BUILD_TYPE:', '^CMAKE_MSVC_RUNTIME_LIBRARY:'
              if (-not (Select-String -Path $cache -Pattern '^CMAKE_GENERATOR:INTERNAL=Ninja$' -Quiet)) {
                throw "Expected Ninja in $cache"
              }
              if (-not (Select-String -Path $cache -Pattern '^CMAKE_BUILD_TYPE:[^=]+=Release$' -Quiet)) {
                throw "Expected Release in $cache"
              }
            }
          }

      - name: Compile C++ tests
        run: |
          sccache --zero-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # cc_test registers each test under its executable target name.
          ctest --test-dir build --show-only=json-v1 | Out-File benchmark-artifacts/ctest-inventory.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = Get-Content benchmark-artifacts/ctest-inventory.json -Raw | ConvertFrom-Json
          $targets = @($inventory.tests | ForEach-Object { $_.name })
          if ($targets.Count -eq 0) { throw "No C++ test targets found" }
          Write-Host "Compiling $($targets.Count) tests with $env:CMAKE_BUILD_PARALLEL_LEVEL build jobs"
          cmake --build build --config Release --target @targets
        shell: powershell

      - name: Show sccache statistics after test compilation
        if: always()
        continue-on-error: true
        run: |
          sccache --show-stats
          sccache --show-stats --stats-format json | Out-File benchmark-artifacts/sccache-test-compile.json -Encoding utf8
        shell: powershell

      - name: Run C++ Tests
        run: |
          $testJobs = [Math]::Max(1, [int]$env:NPROC - 1)
          ctest --test-dir build --build-config Release --output-on-failure --parallel $testJobs
        shell: powershell

      - name: Show sccache statistics after tests
        if: always()
        continue-on-error: true
        run: sccache --show-stats
        shell: powershell

      - name: Run Python Tests
        run: |
          cd "$env:GITHUB_WORKSPACE"
          python -m pytest python/tests/ --basetemp=./.pytest_tmp --junitxml=benchmark-artifacts/pytest.xml
        shell: powershell

      - name: Run C++ Examples
        run: |
          cd "$env:GITHUB_WORKSPACE\examples\c++"
          mkdir build
          cd build
          # These small examples do not need a remote compiler cache. Clear
          # both launchers so a cache outage cannot block their smoke tests.
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER= `
            -DCMAKE_CXX_COMPILER_LAUNCHER=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copy zvec DLLs next to the example executables so Windows can find them.
          # CMake places DLLs in bin/ (RUNTIME output) and import libs in lib/.
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          foreach ($dllName in @("zvec.dll", "zvec_core.dll", "zvec_ailego.dll")) {
            $found = $false
            foreach ($sub in @("$buildDir\bin", "$buildDir\bin\Release", "$buildDir\lib", "$buildDir\lib\Release")) {
              $dllPath = Join-Path $sub $dllName
              if (Test-Path $dllPath) {
                Copy-Item $dllPath -Destination . -Force
                Write-Host "Copied $dllName from $sub"
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "WARNING: $dllName not found, searching recursively..."
              $dll = Get-ChildItem -Path $buildDir -Filter $dllName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dll) {
                Copy-Item $dll.FullName -Destination . -Force
                Write-Host "Copied $dllName from $($dll.DirectoryName)"
              } else {
                Write-Error "$dllName not found anywhere under $buildDir"
              }
            }
          }

          .\db-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\core-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\diskann-core-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ailego-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      - name: Show sccache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
        shell: powershell

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vs2026-cold-cache-diagnostics
          include-hidden-files: true
          path: |
            benchmark-artifacts/
            build/.ninja_log
            build/Testing/Temporary/LastTest.log
            .pytest_tmp/**/LOG
            .pytest_tmp/**/LOG.old.*
